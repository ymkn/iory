name: Release Windows Installers

on:
  push:
    branches:
      - main
    paths:
      - src-tauri/tauri.conf.json

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version bump
        id: version
        shell: pwsh
        run: |
          $configPath = "src-tauri/tauri.conf.json"
          $current = (Get-Content $configPath -Raw | ConvertFrom-Json).version

          $previousContent = git show "HEAD^:$configPath" 2>$null
          if (-not $previousContent) {
            "changed=false" >> $env:GITHUB_OUTPUT
            "version=$current" >> $env:GITHUB_OUTPUT
            Write-Host "Previous Tauri config was not found. Skipping release."
            exit 0
          }

          $previous = ($previousContent | Out-String | ConvertFrom-Json).version
          "version=$current" >> $env:GITHUB_OUTPUT

          if ($current -eq $previous) {
            "changed=false" >> $env:GITHUB_OUTPUT
            Write-Host "Version unchanged ($current). Skipping release."
            exit 0
          }

          "changed=true" >> $env:GITHUB_OUTPUT
          Write-Host "Version changed: $previous -> $current"

      - name: Check existing release
        id: existing_release
        if: steps.version.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tagName = "v${{ steps.version.outputs.version }}"
          gh release view $tagName --repo "${{ github.repository }}" *> $null
          $releaseViewExitCode = $LASTEXITCODE

          if ($releaseViewExitCode -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tagName already exists. Skipping release."
            exit 0
          }

          "exists=false" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tagName does not exist yet."
          exit 0

      - name: Setup Node
        if: steps.version.outputs.changed == 'true' && steps.existing_release.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true' && steps.existing_release.outputs.exists == 'false'
        run: npm ci

      - name: Install Rust stable
        if: steps.version.outputs.changed == 'true' && steps.existing_release.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows Rust targets
        if: steps.version.outputs.changed == 'true' && steps.existing_release.outputs.exists == 'false'
        run: rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Cache Rust build
        if: steps.version.outputs.changed == 'true' && steps.existing_release.outputs.exists == 'false'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build x64 installer and create release
        id: build_x64
        if: steps.version.outputs.changed == 'true' && steps.existing_release.outputs.exists == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: IORY v__VERSION__
          releaseBody: Windows installer for IORY v__VERSION__.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false
          args: --target x86_64-pc-windows-msvc --bundles nsis

      - name: Build ARM64 installer and upload to release
        if: steps.version.outputs.changed == 'true' && steps.existing_release.outputs.exists == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ steps.build_x64.outputs.releaseId }}
          uploadUpdaterJson: false
          args: --target aarch64-pc-windows-msvc --bundles nsis
