name: Validate

on:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/**
      - package.json
      - package-lock.json
      - src/**
      - src-tauri/**
      - index.html
      - tsconfig.json
      - vite.config.ts
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - package.json
      - package-lock.json
      - src/**
      - src-tauri/**
      - index.html
      - tsconfig.json
      - vite.config.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: iory-windows-validation-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
